name: Security Audit

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '**/Cargo.toml'

permissions:
  contents: read

jobs:
  cargo-deny:
    permissions:
      checks: write
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: EmbarkStudios/cargo-deny-action@v2
